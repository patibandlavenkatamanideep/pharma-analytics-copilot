# Versioned metric registry.
#
# This file is the single server-owned source of metric arithmetic. The language
# model may SELECT a key from it; it may never supply a formula, a table name, a
# join or a SQL fragment. Every entry anchors to the supplied business document
# that defines it, so a reviewer can trace any number back to the specification.
#
# `sql` fragments are templates over a fixed set of pre-aggregated component
# names owned by the compiler -- they are not user- or model-reachable strings.

version: "1.4.0"

# --- shared component expressions -------------------------------------------
components:
  equivalents:
    # A2: pack_units * unit_conversion_factor. The documented milligram
    # alternative is deliberately absent -- it disagrees on 602,211 generated
    # rows because the generator sets total_mg = packs * mg_equivalent.
    expr: "s.pack_units * p.unit_conversion_factor"
    null_policy: "NULL factor yields NULL, never 0 or 1"
  pack_units:
    expr: "s.pack_units"
  wac_amount:
    # A8: already a per-transaction dollar amount; never multiplied by volume.
    expr: "s.wac"

metrics:

  paid_pack_units:
    label: "paid pack units"
    unit: "packs"
    anchor: "docs/metric_definitions.md#paid-demand"
    sources: ["distributor"]
    company_only: true
    aggregate: "SUM"
    component: pack_units
    requires_wac: false
    description: >
      Purchased volume in packs. THE DEFAULT for "volume", "sales", "demand"
      and "units" when the user does not say otherwise. Distributor source
      only; hub dispense (free drug) and market data are excluded by default.

  paid_equivalents:
    label: "paid equivalents"
    unit: "equivalents"
    anchor: "docs/metric_definitions.md#equivalents"
    sources: ["distributor"]
    company_only: true
    aggregate: "SUM"
    component: equivalents
    requires_wac: false
    quality_checks: ["conversion_factor_coverage"]
    description: >
      Dose-normalised units, comparing different package sizes on one basis via
      unit_conversion_factor. Use ONLY when the user says "equivalents" or asks
      for a normalised measure -- a bare "volume" means paid_pack_units.

  pap_volume:
    label: "patient assistance (free drug) volume"
    unit: "packs"
    anchor: "docs/data_source_guide.md#hub_dispense"
    sources: ["hub_dispense"]
    company_only: true
    aggregate: "SUM"
    component: pack_units
    requires_wac: false
    description: >
      Free drug dispensed through the patient assistance hub. Never counted as
      paid demand or revenue.

  total_volume_incl_free:
    label: "total volume including free drug"
    unit: "packs"
    anchor: "docs/data_source_guide.md#hub_dispense"
    sources: ["distributor", "hub_dispense"]
    company_only: true
    aggregate: "SUM"
    component: pack_units
    requires_wac: false
    description: >
      Paid plus free company volume. Market data is never added in.

  market_equivalents:
    label: "total market equivalents"
    unit: "equivalents"
    anchor: "docs/data_source_guide.md#market_data"
    sources: ["market_data"]
    company_only: false     # the denominator is ALL market_data rows
    aggregate: "SUM"
    component: equivalents
    requires_wac: false
    quality_checks: ["conversion_factor_coverage"]
    description: >
      Third-party reported market volume for the relevant market. Includes
      competitors and, where present, company brand.

  wac_revenue:
    label: "gross revenue (WAC)"
    unit: "USD"
    anchor: "docs/metric_definitions.md#gross-revenue-wac"
    sources: ["distributor"]
    company_only: true
    aggregate: "SUM"
    component: wac_amount
    requires_wac: true      # Exec AND can_view_wac = 1
    description: >
      List-price revenue. Not net of rebates or discounts; no such fields exist.

  brand_market_share:
    label: "market share"
    unit: "ratio"
    anchor: "docs/metric_definitions.md#market-share"
    kind: "ratio"
    numerator: paid_equivalents
    denominator: market_equivalents
    # A3: the denominator is scoped to the market subcategory of the products in
    # the numerator, never to the company drug name and never to brand_flag = 1.
    denominator_scope: "market_subcategory"
    # The market is not our own sales, so product identity is DROPPED from the
    # denominator. Declared rather than inferred: the compiler used to apply
    # this widening to every ratio, which is right here and wrong for
    # pap_proportion.
    denominator_population: "surrounding_market"
    zero_denominator: "null"
    requires_wac: false
    quality_checks: ["denominator_completeness", "ratio_above_one", "conversion_factor_coverage"]
    description: >
      Company distributor equivalents divided by total market equivalents in the
      same market subcategory, with identical population and period filters.

  market_segment_share:
    label: "market segment share"
    unit: "ratio"
    anchor: "docs/market_classification.md"
    kind: "ratio"
    numerator: market_equivalents
    denominator: market_equivalents
    # Numerator and denominator are the SAME source. What separates them is the
    # segment filter: the numerator keeps it, the denominator drops it, so this
    # answers "what share of this market is <segment>". With
    # classifications: [generic] it is generic share; with
    # [branded_competitor] it is branded-competitor share.
    denominator_scope: "market_subcategory"
    denominator_population: "surrounding_market"
    zero_denominator: "null"
    requires_wac: false
    quality_checks: ["conversion_factor_coverage", "derived_classification"]
    description: >
      Share of reported market volume held by the filtered segment. Use for
      "generic share", "biosimilar share" or "competitor share" of a market.
      Generic vs branded-competitor is a DERIVED classification, because
      brand_flag = 0 covers both; answers say so.

  share_340b:
    label: "340B share of volume"
    unit: "ratio"
    anchor: "docs/account_analytics.md#340b-program"
    kind: "ratio"
    numerator: paid_pack_units
    denominator: paid_pack_units
    # Same metric on both sides. What separates them is the 340B filter: the
    # numerator keeps whatever the question asked for, the denominator resets
    # it to "include" so the whole is the unfiltered population. Every OTHER
    # filter is kept on both sides, so "what share of our Zenovax volume is
    # 340B" divides by Zenovax volume, not by everything.
    denominator_population: "ignores_340b"
    zero_denominator: "null"
    requires_wac: false
    description: >
      Volume from 340B accounts as a proportion of total volume over the same
      population and period. Use for "what percentage of our volume comes from
      340B accounts". Set filters.is_340b to "only" for the numerator.

  pap_proportion:
    label: "PAP share of total volume"
    unit: "ratio"
    anchor: "docs/data_source_guide.md#hub_dispense"
    kind: "ratio"
    numerator: pap_volume
    denominator: total_volume_incl_free
    # Both sides describe the SAME products. "What proportion of Zenovax
    # volume was free" is 20 / (110 + 20), not 20 / everything the company
    # sold. Widening the denominator here understated the proportion.
    denominator_population: "same_population"
    zero_denominator: "null"
    requires_wac: false
    description: >
      Hub volume as a proportion of paid plus free company volume.

  volume_growth:
    label: "volume growth"
    unit: "ratio"
    anchor: "docs/account_analytics.md#account-performance--ranking"
    kind: "period_change"
    change: "relative"       # (current - prior) / prior
    base_metric: paid_pack_units
    zero_prior: "new_activity"
    requires_wac: false
    description: >
      Percent change between the requested window and its comparison window.
      A zero prior period is reported as new activity, not as infinite growth.

  share_trend_pp:
    label: "market share trend"
    unit: "percentage points"
    anchor: "docs/metric_definitions.md#r3m-vs-r6m-trend"
    kind: "period_change"
    change: "absolute"       # current_share - prior_share, in points
    base_metric: brand_market_share
    requires_wac: false
    description: >
      Change in market share between two windows, expressed in percentage
      points. Distinct from percent growth.

  weighted_share_trend:
    label: "volume-weighted share trend"
    unit: "proposed composite"
    anchor: "docs/metric_definitions.md#r3m-vs-r6m-trend"
    kind: "period_change"
    change: "weighted"
    base_metric: brand_market_share
    # A12: the source does not say whether "Volume" is company or market volume.
    weight_metric: market_equivalents
    proposed: true
    requires_wac: false
    description: >
      (current share - prior share) * (current volume + prior volume). The
      supplied definition does not state which volume is meant; total market
      equivalents is a PROPOSED interpretation and answers say so.

  facility_count_all:
    label: "number of facilities on record"
    unit: "facilities"
    anchor: "docs/org_hierarchy.md"
    # STRUCTURAL: counted from the organization hierarchy, not from sales.
    # facility_count answers "how many facilities did we sell to", which
    # silently excludes every facility that happened not to transact in the
    # window. For "how many facilities does this health system have" that is
    # the wrong number, and nothing said so.
    kind: "count_structural"
    count_entity: "facility"
    requires_wac: false
    description: >
      Distinct facilities in the organization hierarchy, independent of
      whether they have sales. Scope is still enforced by row-level security,
      so a RAM counts only facilities in their territory. Use for "how many
      facilities does each health system have" and "list all standalone
      facilities"; use facility_count for "how many facilities did we sell to".

  account_count:
    label: "number of accounts"
    unit: "accounts"
    anchor: "docs/account_analytics.md#organization-hierarchy"
    kind: "count_distinct"
    count_entity: "account"
    # Without these the count spans every source, so an account that only
    # appears in third-party market data would be counted as one we sell to.
    sources: ["distributor"]
    company_only: true
    requires_wac: false
    description: >
      Distinct top-level accounts. The counted entity is always stated, and
      hierarchy levels are never summed as if all rows were facilities.

  facility_count:
    label: "number of facilities"
    unit: "facilities"
    anchor: "docs/account_analytics.md#organization-hierarchy"
    kind: "count_distinct"
    count_entity: "facility"
    sources: ["distributor"]
    company_only: true
    requires_wac: false
    description: >
      Distinct facility organizations THAT HAVE PAID SALES in the window.
      Use facility_count_all for a structural count of facilities on record,
      whether or not they transacted. "Active facilities" additionally filters
      org_status = 'Active'; historical volume may include inactive accounts.
