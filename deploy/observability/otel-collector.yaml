# OpenTelemetry Collector (contrib distribution) for the application's OTLP
# export. Point PAC_OTEL_ENDPOINT at the OTLP/HTTP receiver.
#
# Metrics leave as a Prometheus scrape endpoint. No trace backend has been
# chosen: until one is, traces go to the debug exporter at basic verbosity,
# which logs how many spans arrived and nothing they contain. Replace it with
# the deployment's trace exporter. Nothing is written to local files; the
# drill adds that with otel-collector.local-files.yaml. Every address comes
# from the environment, with these defaults.
receivers:
  otlp:
    protocols:
      http:
        endpoint: ${env:PAC_OTEL_RECEIVER:-127.0.0.1:4318}

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:PAC_OTEL_LIMIT_MIB:-256}
    spike_limit_mib: 64
  batch:
    timeout: 1s

exporters:
  prometheus:
    endpoint: ${env:PAC_OTEL_PROMETHEUS:-127.0.0.1:8889}
    # A series not updated for this long is dropped from the scrape, so a
    # process that stops exporting shows as absent instead of frozen at its
    # last value. Longer than the application's 15 s export interval.
    metric_expiration: ${env:PAC_OTEL_METRIC_EXPIRATION:-2m}
    resource_to_telemetry_conversion:
      enabled: false
  debug:
    verbosity: basic

service:
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
