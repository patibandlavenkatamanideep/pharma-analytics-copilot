name: CI

# Runs everything that needs no credentials and no spend: PostgreSQL in a
# service container, the FULL 2,000,000-row dataset, and the deterministic
# offline planner.
#
# Full data rather than seed, deliberately. Seed zip_territory carries only 9 of
# the 15 territory labels the users table references, so most scoped accounts
# resolve to nothing and the security tests would pass vacuously
# (docs/ASSUMPTIONS.md#a5). A green build on seed data would mean very little.
# Generating and loading costs about two and a half minutes.

on:
  push:
    # main, and the post-assessment branches, so their CI runs without
    # waiting for a pull request.
    branches: [main, "post-assessment/**"]
  pull_request:
  # Run on any branch from the Actions tab or `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      PAC_DB_HOST: 127.0.0.1
      PAC_DB_PORT: "5432"
      PAC_ADMIN_DSN: postgresql://postgres:ci-postgres@127.0.0.1:5432/postgres
      PAC_LLM_PROVIDER: offline
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The same hashed set the image installs, then the test tools.
          pip install --require-hashes -r requirements.lock
          pip install pytest==8.3.4 pytest-asyncio==0.25.0 httpx==0.28.1
          pip install --no-deps -e .

      - name: Bootstrap database, roles and security policies
        run: python scripts/bootstrap_db.py --drop

      - name: Generate the full dataset
        run: python schema/generate_data.py

      - name: Load the full dataset
        run: python scripts/load_data.py --mode full

      - name: Build the coherent-market fixture database
        run: python scripts/build_fixture_db.py

      # tests/security mutates roles, territories and pricing permission, so
      # it runs only against a disposable database. Without this step those
      # tests SKIPPED in CI and the job still went green -- which is exactly
      # what the strict gate below now refuses to allow.
      - name: Build the disposable authorization-test database
        run: python scripts/build_authtest_db.py

      # Ingestion tests add, correct and delete sales and move the reporting
      # anchor, so they get a database of their own.
      - name: Build the disposable ingestion-test database
        run: python scripts/build_ingesttest_db.py

      - name: Verify the security boundary is intact
        run: |
          python - <<'PY'
          from app.db import verify_runtime_role_safety
          problems = verify_runtime_role_safety()
          if problems:
              raise SystemExit("SECURITY BOUNDARY BROKEN: " + "; ".join(problems))
          print("boundary intact")
          PY

      # --release-gate turns any skip, collection error or unapproved xfail
      # into a failure, and refuses a session in which nothing passed. Plain
      # `pytest tests/security -q` exits 0 when every test skips for a
      # missing database, which is a green tick for a run that checked
      # nothing.
      #
      # PAC_SECURITY_MIN_TESTS is a SECONDARY guard against a narrowed
      # selection. It is maintained deliberately: raise it when security
      # tests are added. It is not the definition of the requirement --
      # collected tests that skip still fail the gate.
      - name: Security suite (release gate, strict)
        env:
          PAC_SECURITY_MIN_TESTS: "391"
        run: |
          python -m pytest tests/security -q \
            --release-gate --min-tests "$PAC_SECURITY_MIN_TESTS"

      # Strict for the same reason as the security suite: without its
      # database every ingestion test skips, and a skip is not a pass.
      # Includes the input contract and the jobs process's telemetry and
      # freshness (review of 1 October 2026, R4 and R5).
      - name: Incremental ingestion (strict)
        run: |
          python -m pytest tests/integration/test_ingestion.py tests/unit/test_ingest_calendar.py \
            tests/integration/test_ingest_contract.py tests/integration/test_ingest_observability.py \
            tests/unit/test_ingest_validation.py \
            -q --release-gate --min-tests 165

      - name: Full test suite
        run: python -m pytest tests -q

      # This step used to be named "Held-out question set" and ran the
      # default suite -- which is the regression set the system was
      # developed against. It is a gate, and is named as one.
      - name: Regression question set (offline planner, gate)
        run: python scripts/run_evals.py --provider offline --questions evals/questions.yaml

      # The held-out sets are MEASUREMENTS, not gates. Gating on a holdout
      # turns it into a target, and a set tuned against stops being held out.
      # continue-on-error keeps a failure visible on the run without blocking
      # it; the record is uploaded below either way.
      - name: Held-out set 1 (measurement, not a gate)
        continue-on-error: true
        run: python scripts/run_evals.py --provider offline --questions evals/holdout.yaml

      - name: Held-out set 2 (measurement, not a gate)
        continue-on-error: true
        run: python scripts/run_evals.py --provider offline --questions evals/holdout2.yaml

      - name: The release gate itself must reject unverified runs
        run: python -m pytest tests/unit/test_release_gate_strict.py tests/unit/test_release_gate.py -q

      # Real Chromium against the real server and the disposable database:
      # sign-in, reload, sign-out, identity change, conversation ownership,
      # clarification by choosing, an ended session. The runner provisions
      # disposable identities and removes them afterwards.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Browser journeys (Playwright, Chromium)
        run: |
          npm --prefix web ci
          npm --prefix web run build
          (cd web && npx playwright install --with-deps chromium)
          python scripts/browser_journeys.py

      - name: Upload evaluation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-run
          path: evals/runs/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      # The component tests used to exist and never run in CI: this job
      # built the bundle and stopped. They are the only automated check of
      # the identity-isolation logic in the browser.
      # vitest fails on zero test files, but not on a suite that got smaller
      # (a deleted file, an it.skip). The floor is maintained like the
      # security floor, and the unit suite checks it equals the tests defined.
      - name: Component tests (vitest, jsdom, gated)
        env:
          PAC_COMPONENT_MIN_TESTS: "22"
        run: |
          npm --prefix web test -- --reporter=default --reporter=json \
            --outputFile=component-results.json
          python3 scripts/check_component_results.py web/component-results.json \
            "$PAC_COMPONENT_MIN_TESTS"
      - run: npm --prefix web run build

  # The container image is a deliverable, so it is built on every push rather
  # than trusted. Built and exercised, never pushed: no registry, no cloud, no
  # cost beyond runner minutes.
  # Dependencies and secrets. Fails on a known vulnerability with a fix, and
  # on any credential-shaped string anywhere in the history.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # the secret scan reads every commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Python dependencies against known vulnerabilities (pinned, hashed lock)
        run: |
          pip install pip-audit==2.7.3
          pip-audit --require-hashes --disable-pip -r requirements.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: JavaScript dependencies against known vulnerabilities
        working-directory: web
        run: |
          npm ci --no-fund
          npm audit --omit=dev --audit-level=high

      - name: No secret in any commit
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --no-banner

  image:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pharma-analytics-copilot:ci
          # The image carries the commit it was built from (/health, spans,
          # the OCI revision label), so a running container can be tied to
          # this run's test and evaluation records.
          build-args: PAC_RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Known-vulnerable packages in the OS layer or the Python environment
      # fail the build when a fixed version exists. Policy and exceptions:
      # docs/SUPPLY_CHAIN.md.
      - name: Scan the image for vulnerabilities with a fix available
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: pharma-analytics-copilot:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # The application refuses to serve unless it can verify the database
      # security boundary. That is deliberate -- a mis-provisioned deployment
      # must fail loudly rather than quietly serve unrestricted data -- so the
      # first assertion is that it does NOT come up without a database.
      - name: It refuses to start with no database
        run: |
          docker run --rm --name pac-nodb \
            -e PAC_DB_HOST=127.0.0.1 -e PAC_LLM_PROVIDER=offline \
            pharma-analytics-copilot:ci \
            timeout 25 uvicorn app.api.main:app --host 0.0.0.0 --port 8000 \
            > nodb.log 2>&1 && echo "started anyway" || true
          if grep -qiE "connection refused|boundary" nodb.log; then
            echo "refused to serve without a database, as designed"
          else
            echo "expected a startup refusal; got:"; tail -20 nodb.log; exit 1
          fi

      # The image must also contain everything needed to provision, not just to
      # serve. Passwords are supplied as environment variables and --no-env
      # keeps the container from writing a .env, so nothing has to be copied
      # back out of a container that deliberately does not run as root.
      - name: Provision the database using the image itself
        env:
          PAC_DB_OWNER_PASSWORD: ci-owner-pw
          PAC_DB_AUTH_PASSWORD: ci-auth-pw
          PAC_DB_EXEC_PASSWORD: ci-exec-pw
          PAC_DB_SCOPED_PASSWORD: ci-scoped-pw
        run: |
          docker run --rm --network host \
            -e PAC_DB_HOST=127.0.0.1 \
            -e PAC_ADMIN_DSN=postgresql://postgres:ci-postgres@127.0.0.1:5432/postgres \
            -e PAC_DB_OWNER_PASSWORD -e PAC_DB_AUTH_PASSWORD \
            -e PAC_DB_EXEC_PASSWORD -e PAC_DB_SCOPED_PASSWORD \
            pharma-analytics-copilot:ci \
            python scripts/bootstrap_db.py --drop --no-env
          echo "bootstrapped from inside the image"

      # bootstrap_db.py imports only psycopg, so it passed even when the app
      # package was unimportable inside the image. Assert a script that does
      # import it actually runs.
      - name: Scripts inside the image can import the app package
        run: |
          docker run --rm --network host \
            -e PAC_DB_HOST=127.0.0.1 \
            pharma-analytics-copilot:ci \
            python -c "import app.data.loader, app.pipeline, app.api.main; print('app package importable')"

      # The serving process must not hold the owner credential. In the cloud
      # environment it refuses to start if given one: migrations and loads
      # run in the one-shot jobs container instead.
      - name: It refuses to serve while holding the owner credential
        env:
          PAC_DB_OWNER_PASSWORD: ci-owner-pw
          PAC_DB_AUTH_PASSWORD: ci-auth-pw
          PAC_DB_EXEC_PASSWORD: ci-exec-pw
          PAC_DB_SCOPED_PASSWORD: ci-scoped-pw
        run: |
          docker run --rm --network host \
            -e PAC_DB_HOST=127.0.0.1 -e PAC_ENVIRONMENT=cloud \
            -e PAC_DB_OWNER_PASSWORD -e PAC_DB_AUTH_PASSWORD \
            -e PAC_DB_EXEC_PASSWORD -e PAC_DB_SCOPED_PASSWORD \
            -e PAC_LLM_PROVIDER=offline \
            pharma-analytics-copilot:ci \
            timeout 25 uvicorn app.api.main:app --host 0.0.0.0 --port 8001 \
            > owner.log 2>&1 && echo "started anyway" || true
          if grep -q "OWNER credential" owner.log; then
            echo "refused to serve with the owner credential, as designed"
          else
            echo "expected a refusal; got:"; tail -20 owner.log; exit 1
          fi

      - name: Start the container against the database
        env:
          PAC_DB_AUTH_PASSWORD: ci-auth-pw
          PAC_DB_EXEC_PASSWORD: ci-exec-pw
          PAC_DB_SCOPED_PASSWORD: ci-scoped-pw
        run: |
          docker run -d --name pac --network host \
            -e PAC_DB_HOST=127.0.0.1 -e PAC_ENVIRONMENT=cloud \
            -e PAC_DB_AUTH_PASSWORD="$PAC_DB_AUTH_PASSWORD" \
            -e PAC_DB_EXEC_PASSWORD="$PAC_DB_EXEC_PASSWORD" \
            -e PAC_DB_SCOPED_PASSWORD="$PAC_DB_SCOPED_PASSWORD" \
            -e PAC_LLM_PROVIDER=offline -e PAC_COOKIE_SECURE=false \
            pharma-analytics-copilot:ci
          # GitHub runs steps with `bash -e`, so a bare `[ ... ] && break` aborts
          # the step the first time the condition is false. `if` does not.
          code=""
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          if [ "$code" != "200" ]; then
            echo "never became healthy (last code: ${code:-none})"
            docker logs pac
            exit 1
          fi
          echo "/health 200"

      # No data has been loaded, so readiness must be false. A container that
      # reported ready here would take traffic it cannot serve.
      - name: It is healthy but NOT ready without a published dataset
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ready)
          echo "/ready -> $code"
          [ "$code" = "503" ] || { echo "expected 503 before any data is loaded"; exit 1; }

      - name: The built UI is served from the image
        run: |
          docker exec pac test -f /app/web/dist/index.html
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)
          [ "$code" = "200" ] || { echo "UI not served ($code)"; exit 1; }
          echo "UI served from the same origin"

      - name: The running container reports the commit it was built from
        run: |
          release=$(curl -s http://127.0.0.1:8000/health | python3 -c "import json,sys; print(json.load(sys.stdin)['release'])")
          [ "$release" = "${{ github.sha }}" ] || { echo "expected ${{ github.sha }}, got $release"; exit 1; }
          label=$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' pharma-analytics-copilot:ci)
          [ "$label" = "${{ github.sha }}" ] || { echo "label is $label"; exit 1; }
          echo "release $release"

      - name: Unauthenticated API access is refused
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/me)
          [ "$code" = "401" ] || { echo "expected 401, got $code"; exit 1; }
          echo "/api/me -> 401"

      - name: It does not run as root
        run: |
          user=$(docker exec pac id -un)
          echo "running as: $user"
          [ "$user" != "root" ] || { echo "container runs as root"; exit 1; }

      - name: Stop
        if: always()
        run: docker rm -f pac || true

      # The same image, end to end, as scripts/image_smoke.sh runs it locally:
      # a FRESH database provisioned in one pass (the database a first
      # deployment gets), data published by a jobs container, an Exec and a
      # RAM signing in over real sessions, sign-out, a clean stop, and a
      # second scan. The steps above never sign in, which is how a fresh
      # database that refused every sign-in once went unnoticed.
      - name: Image journeys on a freshly provisioned database
        env:
          PAC_SMOKE_IMAGE: pharma-analytics-copilot:ci
        run: bash scripts/image_smoke.sh
