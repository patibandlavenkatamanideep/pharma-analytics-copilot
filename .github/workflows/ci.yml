name: CI

# Runs everything that needs no credentials and no spend: PostgreSQL in a
# service container, the FULL 2,000,000-row dataset, and the deterministic
# offline planner.
#
# Full data rather than seed, deliberately. Seed zip_territory carries only 9 of
# the 15 territory labels the users table references, so most scoped accounts
# resolve to nothing and the security tests would pass vacuously
# (docs/ASSUMPTIONS.md#a5). A green build on seed data would mean very little.
# Generating and loading costs about two and a half minutes.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      PAC_DB_HOST: 127.0.0.1
      PAC_DB_PORT: "5432"
      PAC_ADMIN_DSN: postgresql://postgres:ci-postgres@127.0.0.1:5432/postgres
      PAC_LLM_PROVIDER: offline
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Bootstrap database, roles and security policies
        run: python scripts/bootstrap_db.py --drop

      - name: Generate the full dataset
        run: python schema/generate_data.py

      - name: Load the full dataset
        run: python scripts/load_data.py --mode full

      - name: Build the coherent-market fixture database
        run: python scripts/build_fixture_db.py

      - name: Verify the security boundary is intact
        run: |
          python - <<'PY'
          from app.db import verify_runtime_role_safety
          problems = verify_runtime_role_safety()
          if problems:
              raise SystemExit("SECURITY BOUNDARY BROKEN: " + "; ".join(problems))
          print("boundary intact")
          PY

      - name: Security suite (release gate)
        run: python -m pytest tests/security -q

      - name: Full test suite
        run: python -m pytest tests -q

      - name: Held-out question set (offline planner, no spend)
        run: python scripts/run_evals.py

      - name: Upload evaluation record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-run
          path: evals/runs/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build

  # The container image is a deliverable, so it is built on every push rather
  # than trusted. Built and exercised, never pushed: no registry, no cloud, no
  # cost beyond runner minutes.
  image:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pharma-analytics-copilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The application refuses to serve unless it can verify the database
      # security boundary. That is deliberate -- a mis-provisioned deployment
      # must fail loudly rather than quietly serve unrestricted data -- so the
      # first assertion is that it does NOT come up without a database.
      - name: It refuses to start with no database
        run: |
          docker run --rm --name pac-nodb \
            -e PAC_DB_HOST=127.0.0.1 -e PAC_LLM_PROVIDER=offline \
            pharma-analytics-copilot:ci \
            timeout 25 uvicorn app.api.main:app --host 0.0.0.0 --port 8000 \
            > nodb.log 2>&1 && echo "started anyway" || true
          if grep -qiE "connection refused|boundary" nodb.log; then
            echo "refused to serve without a database, as designed"
          else
            echo "expected a startup refusal; got:"; tail -20 nodb.log; exit 1
          fi

      # The image must also contain everything needed to provision, not just to
      # serve. Passwords are supplied as environment variables and --no-env
      # keeps the container from writing a .env, so nothing has to be copied
      # back out of a container that deliberately does not run as root.
      - name: Provision the database using the image itself
        env:
          PAC_DB_OWNER_PASSWORD: ci-owner-pw
          PAC_DB_AUTH_PASSWORD: ci-auth-pw
          PAC_DB_EXEC_PASSWORD: ci-exec-pw
          PAC_DB_SCOPED_PASSWORD: ci-scoped-pw
        run: |
          docker run --rm --network host \
            -e PAC_DB_HOST=127.0.0.1 \
            -e PAC_ADMIN_DSN=postgresql://postgres:ci-postgres@127.0.0.1:5432/postgres \
            -e PAC_DB_OWNER_PASSWORD -e PAC_DB_AUTH_PASSWORD \
            -e PAC_DB_EXEC_PASSWORD -e PAC_DB_SCOPED_PASSWORD \
            pharma-analytics-copilot:ci \
            python scripts/bootstrap_db.py --drop --no-env
          echo "bootstrapped from inside the image"

      - name: Start the container against the database
        env:
          PAC_DB_OWNER_PASSWORD: ci-owner-pw
          PAC_DB_AUTH_PASSWORD: ci-auth-pw
          PAC_DB_EXEC_PASSWORD: ci-exec-pw
          PAC_DB_SCOPED_PASSWORD: ci-scoped-pw
        run: |
          docker run -d --name pac --network host \
            -e PAC_DB_HOST=127.0.0.1 \
            -e PAC_DB_OWNER_PASSWORD="$PAC_DB_OWNER_PASSWORD" \
            -e PAC_DB_AUTH_PASSWORD="$PAC_DB_AUTH_PASSWORD" \
            -e PAC_DB_EXEC_PASSWORD="$PAC_DB_EXEC_PASSWORD" \
            -e PAC_DB_SCOPED_PASSWORD="$PAC_DB_SCOPED_PASSWORD" \
            -e PAC_LLM_PROVIDER=offline -e PAC_COOKIE_SECURE=false \
            pharma-analytics-copilot:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          [ "$code" = "200" ] || { echo "never became healthy"; docker logs pac; exit 1; }
          echo "/health 200"

      # No data has been loaded, so readiness must be false. A container that
      # reported ready here would take traffic it cannot serve.
      - name: It is healthy but NOT ready without a published dataset
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/ready)
          echo "/ready -> $code"
          [ "$code" = "503" ] || { echo "expected 503 before any data is loaded"; exit 1; }

      - name: The built UI is served from the image
        run: |
          docker exec pac test -f /app/web/dist/index.html
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)
          [ "$code" = "200" ] || { echo "UI not served ($code)"; exit 1; }
          echo "UI served from the same origin"

      - name: Unauthenticated API access is refused
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/me)
          [ "$code" = "401" ] || { echo "expected 401, got $code"; exit 1; }
          echo "/api/me -> 401"

      - name: It does not run as root
        run: |
          user=$(docker exec pac id -un)
          echo "running as: $user"
          [ "$user" != "root" ] || { echo "container runs as root"; exit 1; }

      - name: Stop
        if: always()
        run: docker rm -f pac || true
