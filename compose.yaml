# Local and single-host deployment.
#
# The database port is NOT published to the host: only the app container can
# reach PostgreSQL, over the private compose network.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${PAC_DB_NAME:-pharma_analytics}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # deliberately no `ports:` — the database is not reachable from outside

  app:
    build:
      context: .
      args:
        PAC_RELEASE: ${PAC_RELEASE:-dev}
    # Longer than uvicorn's graceful window (65 s), which is longer than the
    # request deadline (60 s): a stop drains in-flight answers.
    stop_grace_period: 75s
    depends_on:
      db:
        condition: service_healthy
    environment:
      PAC_DB_HOST: db
      PAC_DB_PORT: "5432"
      PAC_DB_NAME: ${PAC_DB_NAME:-pharma_analytics}
      # No PAC_DB_OWNER_PASSWORD: the serving process never creates, alters
      # or loads anything, and refuses to start in the cloud environment if
      # it is given the owner credential. See the `jobs` service below.
      PAC_DB_AUTH_PASSWORD: ${PAC_DB_AUTH_PASSWORD:?}
      PAC_DB_EXEC_PASSWORD: ${PAC_DB_EXEC_PASSWORD:?}
      PAC_DB_SCOPED_PASSWORD: ${PAC_DB_SCOPED_PASSWORD:?}
      PAC_LLM_PROVIDER: ${PAC_LLM_PROVIDER:-offline}
      PAC_BEDROCK_REGION: ${PAC_BEDROCK_REGION:-us-east-1}
      PAC_BEDROCK_MODEL_ID: ${PAC_BEDROCK_MODEL_ID:-}
      PAC_COOKIE_SECURE: ${PAC_COOKIE_SECURE:-true}
      PAC_ENVIRONMENT: cloud
      # Optional OTLP/HTTP collector; unset, no telemetry leaves the process.
      PAC_OTEL_ENDPOINT: ${PAC_OTEL_ENDPOINT:-}
      # Credentials come from the task role in AWS; these are for local runs.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      # Loopback only. In production Caddy reaches the app over the private
      # compose network, so this exists purely for debugging on the host and
      # is never exposed to the internet.
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  # One-shot work that needs the owner role: migrations and ingestion.
  # Same image, run on demand, never left running, never published:
  #   docker compose --profile jobs run --rm jobs python scripts/migrate.py
  #   docker compose --profile jobs run --rm jobs python scripts/load_data.py --mode full
  jobs:
    build:
      context: .
      args:
        PAC_RELEASE: ${PAC_RELEASE:-dev}
    profiles: ["jobs"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PAC_DB_HOST: db
      PAC_DB_PORT: "5432"
      PAC_DB_NAME: ${PAC_DB_NAME:-pharma_analytics}
      PAC_DB_OWNER_PASSWORD: ${PAC_DB_OWNER_PASSWORD:?}
      PAC_DB_AUTH_PASSWORD: ${PAC_DB_AUTH_PASSWORD:?}
      PAC_ENVIRONMENT: cloud
      # Ingestion exports its own batches, events, quarantine and freshness
      # (scripts/ingest.py); unset, nothing leaves the process.
      PAC_OTEL_ENDPOINT: ${PAC_OTEL_ENDPOINT:-}
    command: ["python", "scripts/migrate.py"]
    restart: "no"

volumes:
  pgdata:
