[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharma-analytics-copilot"
version = "1.0.0"
description = "Governed natural-language analytics over a pharmaceutical sales database"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["app*"]

# The metric registry is not documentation -- app/analytics/registry.py reads
# it at import and the process cannot start without it. Without this the wheel
# contained only .py files, so an installed copy raised FileNotFoundError on
# the first import of the registry. Verified by tests/unit/test_packaging.py.
[tool.setuptools.package-data]
"app.analytics" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a loaded database",
    "security: authorization boundary tests",
    "live: calls the configured LLM provider and costs money",
]
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_default_fixture_loop_scope = "function"
